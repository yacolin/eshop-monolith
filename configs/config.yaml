server:
  port: 8080
  mode: debug  # debug, release, test
  env: development  # development, production, test  ← 新增
  read_timeout: 30s
  write_timeout: 30s

mysql:
  host: localhost
  port: 3306
  username: root
  password: 123456
  database: eshop_db
  charset: utf8mb4
  socket: ""  # Unix socket 路径（留空自动探测）
  max_idle_conns: 50   # 高并发预热连接
  max_open_conns: 50
  max_lifetime: 1h     # ← 新增
  max_idle_time: 5m    # ← 新增
  timeout: 10s         # ← 新增
  read_timeout: 30s    # ← 新增
  write_timeout: 30s   # ← 新增

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0
  pool_size: 20       # 应对 100 并发
  min_idle_conns: 5   # 预热连接数
  max_retries: 0      # 去掉重试避免延迟放大
  dial_timeout: 5s     # ← 新增
  read_timeout: 3s     # ← 新增
  write_timeout: 3s    # ← 新增
  pool_timeout: 4s     # ← 新增

jwt:
  secret: "your-secret-key-change-in-production"
  expire_hours: 24
  refresh_expire_hours: 168  # 7 days

log:
  level: info  # debug, info, warn, error
  format: json  # json, text
  output: stdout  # stdout, file
  file_path: logs/app.log

rate_limit:
  enabled: true
  requests_per_second: 100
  burst: 200

cors:
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"
    - "http://localhost:8000"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allowed_headers:
    - "Origin"
    - "Content-Type"
    - "Authorization"

pagination:
  default_size: 10  # ← 新增
  max_size: 100     # ← 新增

rabbitmq:
  host: localhost
  port: 5672
  username: guest
  password: guest
  vhost: /
  exchange: eshop.events
  prefetch_count: 10
  retry_limit: 3
  retry_delay_ms: 5000